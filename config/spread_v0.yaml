# milestone 1 first model: btc-only hedge (pre-registered target), 7 features (d6), ridge (d9)
name: spread_v0
leaders: [BTCUSDT, ETHUSDT]
followers: [SOLUSDT, XRPUSDT, DOGEUSDT]
hedge: btc                     # btc | btc+index (d3b comparison)
dates:
  select: {start: 2023-01-01, end: 2023-12-31}
  walk_forward: {start: 2024-01-01, end: 2024-12-31}
  holdout: {start: 2025-01-01, end: 2025-11-30}   # only via /holdout
target: {horizon_bars: 5, report_horizons: [1, 5, 15], vol_scale: true}
beta: {window_days: 7}
walk_forward: {window_days: 60, test_days: 7, refit_hours: 168, purge_bars: 5}
features: [btc_ema3_15, gap15, gap60, own_ema3, tib, tib_diff, btc_vol]
tails: {method: trailing_z, clip: 5}
model: {type: ridge, alpha: 1.0, alpha_grid: [0.1, 1.0, 10.0]}   # alpha picked on 2023 (d9), then frozen
costs: {taker_bps: 5.0, half_spread: observed, legs: 2}
baselines:
  static_btc_leads: neg_gap5         # -gap5 = beta * recent btc move not yet matched by the alt
  best_feature: gap15                # best standalone on 2023 (median daily rank ic), sign -1
  best_feature_sign: -1
