# d3b comparison: same as spread_v0 but the target is hedged with btc AND a leave-one-out alt index,
# and the backtest pays for every leg of that hedge
name: spread_v0_2f
leaders: [BTCUSDT, ETHUSDT]
followers: [SOLUSDT, XRPUSDT, DOGEUSDT]
hedge: btc+index
dates:
  select: {start: 2023-01-01, end: 2023-12-31}
  walk_forward: {start: 2024-01-01, end: 2024-12-31}
  holdout: {start: 2025-01-01, end: 2025-11-30}
target: {horizon_bars: 5, report_horizons: [1, 5, 15], vol_scale: true}
beta: {window_days: 7}
walk_forward: {window_days: 60, test_days: 7, refit_hours: 168, purge_bars: 5}
features: [btc_ema3_15, gap15, gap60, own_ema3, tib, tib_diff, btc_vol]
tails: {method: trailing_z, clip: 5}
model: {type: ridge, alpha: 1.0, alpha_grid: [0.1, 1.0, 10.0]}
costs: {taker_bps: 5.0, half_spread: observed, legs: 5}
baselines:
  static_btc_leads: neg_gap5
  best_feature: gap15
  best_feature_sign: -1
